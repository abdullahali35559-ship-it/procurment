name: Procurement Assistant CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
            cd /root/rfi_vps_version
            git pull origin main
            
            # Use venv
            python3 -m venv venv || true
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Kill any old process (be more aggressive with -9)
            pkill -9 -f "api/main.py" || true
            
            # Start the server in background properly
            # We use 'disown' and 'sleep' to ensure it keeps running after SSH closes
            nohup venv/bin/python api/main.py > server_deploy.log 2>&1 &
            sleep 2
            
            # Check if it actually started
            ps aux | grep "api/main.py" | grep -v grep
