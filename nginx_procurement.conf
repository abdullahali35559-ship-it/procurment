server {
    server_name procurement.aiagentichub.io 72.60.79.148;
    root /root/rfi_vps_version/ui;
    index login.html;

    # 1. API & Backend (HIGHEST PRIORITY)
    location /api/ {
        proxy_pass http://127.0.0.1:8067;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 2. Other Proxy Paths
    location ~ ^/(chat|auth|conversations|assistant|documents|calendar|dashboard|threads|drafts|emails|attachments|contacts|tags) {
        proxy_pass http://127.0.0.1:8067;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. UI Routing (Fallback)
    location / {
        try_files $uri $uri/ /login.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/procurement.aiagentichub.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/procurement.aiagentichub.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = procurement.aiagentichub.io) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name procurement.aiagentichub.io 72.60.79.148;
    return 404;
}
